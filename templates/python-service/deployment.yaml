apiVersion: apps/v1
kind: Deployment
metadata: {name: "{{ service_name }}", labels: {owner: "{{ owner }}"}}
spec:
  replicas: 2
  selector: {matchLabels: {app: "{{ service_name }}"}}
  template:
    metadata: {labels: {app: "{{ service_name }}"}}
    spec:
      containers:
        - name: service
          image: "registry.example/{{ service_name }}:latest"
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}}
