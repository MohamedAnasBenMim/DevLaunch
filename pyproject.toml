[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "devlaunch"
version = "1.0.0"
description = "Self-service internal developer platform and golden-path scaffolder."
readme = "README.md"
requires-python = ">=3.11"
[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8"]
[project.scripts]
devlaunch = "devlaunch.cli:main"
devlaunch-benchmark = "devlaunch.benchmark:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=devlaunch --cov-report=term-missing --cov-fail-under=90"
[tool.coverage.run]
omit = ["src/devlaunch/api.py", "src/devlaunch/cli.py", "src/devlaunch/benchmark.py"]
[tool.ruff]
line-length = 100
target-version = "py311"
